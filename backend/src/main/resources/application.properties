spring.application.name=weather-app
# 后端服务端口，前端默认请求 http://localhost:8080。
server.port=${APP_PORT:8080}

# 业务配置：天气源、AI 助手、Web Push 和通知定时任务都从这里读取环境变量。
app.database.schema=${POSTGRES_SCHEMA:weather_app}
app.weather.provider=${WEATHER_PROVIDER:open-meteo}
app.weather.geocoding-base-url=${WEATHER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
app.weather.forecast-base-url=${WEATHER_FORECAST_BASE_URL:https://api.open-meteo.com}
app.weather.qweather.api-key=${QWEATHER_API_KEY:}
app.weather.qweather.geo-base-url=${QWEATHER_GEO_BASE_URL:https://geoapi.qweather.com}
app.weather.qweather.weather-base-url=${QWEATHER_WEATHER_BASE_URL:https://devapi.qweather.com}
app.ai.base-url=${AI_API_BASE_URL:}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.web-push.public-key=${WEB_PUSH_PUBLIC_KEY:${VITE_WEB_PUSH_PUBLIC_KEY:}}
app.web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}
app.web-push.subject=${WEB_PUSH_SUBJECT:mailto:weather-app@example.local}
app.notifications.scheduler.enabled=${NOTIFICATION_SCHEDULER_ENABLED:true}
app.notifications.scheduler.delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:60000}
app.notifications.scheduler.initial-delay-ms=${NOTIFICATION_SCHEDULER_INITIAL_DELAY_MS:60000}

# WebFlux 使用 R2DBC 异步访问 PostgreSQL，主要业务代码都通过 DatabaseClient 执行 SQL。
spring.r2dbc.url=r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:data}
spring.r2dbc.username=${POSTGRES_USER:weather_app}
spring.r2dbc.password=${POSTGRES_PASSWORD:219192}
spring.r2dbc.properties.schema=${POSTGRES_SCHEMA:weather_app}

# Flyway 负责自动建表和升级数据库结构，启动后端时会执行 db/migration 下的 SQL。
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:data}
spring.flyway.user=${POSTGRES_USER:weather_app}
spring.flyway.password=${POSTGRES_PASSWORD:219192}
spring.flyway.default-schema=${POSTGRES_SCHEMA:weather_app}
spring.flyway.schemas=${POSTGRES_SCHEMA:weather_app}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

# 暴露健康检查接口，例如 /actuator/health。
management.endpoints.web.exposure.include=health,info

approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[mcp_servers.postgres]
command = "docker"
args = [
    "run", "-i", "--rm",
    "-e", "DATABASE_URI",
    "crystaldba/postgres-mcp",
    "--access-mode=unrestricted"
]
env = { DATABASE_URI = "postgresql://postgres:wasd..123@172.24.128.1:5432/data" }

[mcp_servers.postgres.tools.list_schemas]
approval_mode = "approve"

[mcp_servers.postgres.tools.execute_sql]
approval_mode = "approve"

[mcp_servers.dart]
command = "dart"
args = ["mcp-server", "--force-roots-fallback"]

[mcp_servers.dart.tools.dart_format]
approval_mode = "approve"

[mcp_servers.dart.tools.list_devices]
approval_mode = "approve"

[mcp_servers.dart.tools.launch_app]
approval_mode = "approve"

[mcp_servers.dart.tools.pub]
approval_mode = "approve"

[mcp_servers.dart.tools.list_running_apps]
approval_mode = "approve"

[mcp_servers.dart.tools.get_app_logs]
approval_mode = "approve"

[mcp_servers.dart.tools.hot_restart]
approval_mode = "approve"

[mcp_servers.dart.tools.hot_reload]
approval_mode = "approve"
